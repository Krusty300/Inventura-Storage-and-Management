[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", "frontend", ".venv", "venv", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # env-var setup before app imports (tests/conftest.py)
    "E712",  # `== True` is used in SQLAlchemy query filters; `is True` would break them
    "E741",  # single-letter loop variables (`l` for lots) are idiomatic here
]
